<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter Tight";
          src: url("assets/fonts/InterTight-800.ttf") format("truetype");
          font-weight: 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter Tight";
          src: url("assets/fonts/InterTight-700.ttf") format("truetype");
          font-weight: 700;
          font-style: normal;
        }
        @font-face {
          font-family: "Bodoni Moda";
          src: url("assets/fonts/BodoniModa-Italic-400.ttf") format("truetype");
          font-weight: 400;
          font-style: italic;
        }
        #broll-verify {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #fffdf8;
          font-family: "Inter Tight", sans-serif;
        }
        #broll-verify .sc {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1160px;
          transform-origin: 50% 45%;
        }
        #broll-verify .lbl {
          position: absolute;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          opacity: 0.6;
          white-space: nowrap;
        }
        #broll-verify .serif {
          font-family: "Bodoni Moda", serif;
          font-style: italic;
          font-weight: 400;
        }
        #broll-verify .box {
          position: absolute;
          border: 2px solid rgba(255, 253, 248, 0.85);
          border-radius: 22px;
        }
        #broll-verify .bar {
          position: absolute;
          height: 12px;
          border-radius: 6px;
          background: rgba(255, 253, 248, 0.34);
          transform-origin: 0% 50%;
        }
        #broll-verify .ic svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        #broll-verify svg.wires {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1160px;
          overflow: visible;
        }
        #broll-verify svg.wires path,
        #broll-verify svg.wires line {
          fill: none;
          stroke: #fffdf8;
          stroke-width: 2;
          stroke-linecap: round;
        }

        #broll-verify .vcard {
          left: 110px;
          top: 290px;
          width: 860px;
          height: 290px;
        }
        #broll-verify .ck {
          position: absolute;
          width: 44px;
          height: 44px;
        }
        #broll-verify .mag {
          position: absolute;
          left: 0;
          top: 0;
          width: 150px;
          height: 150px;
          opacity: 0;
        }
        #broll-verify .src {
          top: 830px;
          width: 240px;
          height: 140px;
        }
      </style>

      <div id="broll-verify" data-composition-id="broll-verify" data-width="1080" data-height="1920">
        <div class="sc">
          <div class="lbl" id="broll-verify-l1" style="left: 114px; top: 236px">Ellenőrzés</div>
          <div class="box vcard" id="broll-verify-card">
            <div class="bar vb" style="left: 44px; top: 60px; width: 560px"></div><div class="ck ic" style="left: 624px; top: 44px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 6 9 17l-5-5" /> </svg></div>
            <div class="bar vb" style="left: 44px; top: 112px; width: 480px"></div><div class="ck ic" style="left: 544px; top: 96px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 6 9 17l-5-5" /> </svg></div>
            <div class="bar vb" style="left: 44px; top: 164px; width: 620px"></div><div class="ck ic" style="left: 684px; top: 148px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 6 9 17l-5-5" /> </svg></div>
            <div class="bar vb" style="left: 44px; top: 216px; width: 430px"></div><div class="ck ic" style="left: 494px; top: 200px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 6 9 17l-5-5" /> </svg></div>
          </div>
          <div class="mag ic" id="broll-verify-mag"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" > <circle cx="11" cy="11" r="8" /> <path d="m21 21-4.3-4.3" /> </svg></div>
          <div class="lbl" id="broll-verify-l2" style="left: 114px; top: 760px">Kutatás</div>
          <svg class="wires" viewBox="0 0 1080 1160">
            <path class="draw sw" d="M230,830 C230,720 540,700 540,582" />
            <path class="draw sw" d="M540,830 L540,582" />
            <path class="draw sw" d="M850,830 C850,720 540,700 540,582" />
          </svg>
          <div class="box src" style="left: 110px"><div class="bar" style="left: 26px; top: 30px; width: 120px; background: rgba(255, 253, 248, 0.7)"></div><div class="bar" style="left: 26px; top: 60px; width: 160px"></div><div class="bar" style="left: 26px; top: 90px; width: 90px"></div></div>
          <div class="box src" style="left: 420px"><div class="bar" style="left: 26px; top: 30px; width: 120px; background: rgba(255, 253, 248, 0.7)"></div><div class="bar" style="left: 26px; top: 60px; width: 160px"></div><div class="bar" style="left: 26px; top: 90px; width: 90px"></div></div>
          <div class="box src" style="left: 730px"><div class="bar" style="left: 26px; top: 30px; width: 120px; background: rgba(255, 253, 248, 0.7)"></div><div class="bar" style="left: 26px; top: 60px; width: 160px"></div><div class="bar" style="left: 26px; top: 90px; width: 90px"></div></div>
        </div>
      </div>

      <script>
        (function () {
          const ROOT = "#broll-verify ";
          const $ = (s) => document.querySelector(ROOT + s);
          const $$ = (s) => Array.from(document.querySelectorAll(ROOT + s));
          // Prime every drawable stroke so a 0 -> 1 "draw" is a dashoffset tween.
          $$("svg.wires .draw").forEach((p) => {
            const len = p.getTotalLength();
            p.style.strokeDasharray = len + " " + len;
            p.style.strokeDashoffset = len;
          });
          const draw = (sel, at, dur, ease) =>
            tl.to(ROOT + sel, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(ROOT + ".sc", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 0);
          tl.fromTo(ROOT + ".sc", { scale: 1 }, { scale: 1.03, duration: 4.24, ease: "none" }, 0);
          const T = {"kiprob": 0.36, "kulonb": 1.17, "ellenor": 1.73, "es": 2.41, "kutat": 2.53, "tech": 3.03, "end": 4.24};
          tl.fromTo("#broll-verify-card, #broll-verify-l1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo(ROOT + ".vb", { scaleX: 0 }, { scaleX: 1, duration: 0.4, stagger: 0.07 }, 0.2);
          tl.set(ROOT + ".ck", { opacity: 0 }, 0);
          tl.set("#broll-verify-mag", { x: 140, y: 300 }, 0);
          tl.to("#broll-verify-mag", { opacity: 1, duration: 0.25 }, T.kiprob);
          tl.to("#broll-verify-mag", { keyframes: [{ x: 640, y: 300 }, { x: 200, y: 352 }, { x: 760, y: 404 }, { x: 560, y: 456 }], duration: T.ellenor - T.kiprob + 0.1, ease: "none" }, T.kiprob);
          tl.to("#broll-verify-mag", { opacity: 0, duration: 0.25 }, T.ellenor + 0.1);
          tl.fromTo(ROOT + ".ck", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.14 }, T.ellenor);
          tl.fromTo("#broll-verify-l2", { opacity: 0 }, { opacity: 0.6, duration: 0.4 }, T.kutat - 0.1);
          tl.fromTo(ROOT + ".src", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, T.kutat);
          for (let k = 0; k < 3; k++) draw("svg.wires .sw:nth-of-type(" + (k + 1) + ")", T.tech - 0.1 + k * 0.1, 0.5);
          tl.to("#broll-verify .sc", { opacity: 0, y: -14, duration: 0.24, ease: "power1.in" }, 4.0);
          window.__timelines["broll-verify"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
