      <style>

        #broll-cta .sc {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1160px;
          transform-origin: 50% 45%;
        }
        #broll-cta .lbl {
          position: absolute;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;

        #broll-cta .serif {

        #broll-cta .box {

          border: 2px solid rgba(255, 253, 248, 0.85);

          display: block;
          width: 100%;
          height: 100%;
        }
        #broll-cta svg.wires {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1160px;
          overflow: visible;
        }
        #broll-cta svg.wires path,
        #broll-cta svg.wires line {
          fill: none;
          stroke: #fffdf8;
          stroke-width: 2;
          stroke-linecap: round;
        }

        #broll-cta .cta {
          position: absolute;
          left: 60px;
          right: 60px;
          top: 700px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          text-shadow: 0 2px 22px rgba(12, 8, 20, 0.28);
        }
        #broll-cta .cta .ic {
          width: 108px;
          height: 108px;
          margin-bottom: 44px;
          filter: drop-shadow(0 2px 14px rgba(12, 8, 20, 0.3));
        }
        #broll-cta .cm {
          font-weight: 800;
          font-size: 94px;
          line-height: 0.9;
          letter-spacing: -0.045em;
          white-space: nowrap;
        }
        #broll-cta .ce {
          font-size: 136px;
          line-height: 0.82;
          letter-spacing: -0.025em;
          margin: -0.06em 0 -0.02em;
          white-space: nowrap;
        }
        #broll-cta .ul {
          width: 520px;
          margin-top: 54px;
          border-top: 2px solid rgba(255, 253, 248, 0.7);
          transform-origin: 50% 50%;

      <div id="broll-cta" data-composition-id="broll-cta" data-width="1080" data-height="1920">
        <div class="sc">
          <div class="cta">
            <div class="ic" id="broll-cta-ico"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" > <path d="M14 4.1 12 6" /> <path d="m5.1 8-2.9-.8" /> <path d="m6 12-1.9 2" /> <path d="M7.2 2.2 8 5.1" /> <path d="M9.037 9.69a.498.498 0 0 1 .653-.653l11 4.5a.5.5 0 0 1-.074.949l-4.349 1.041a1 1 0 0 0-.74.739l-1.04 4.35a.5.5 0 0 1-.95.074z" /> </svg></div>
            <div class="cm" id="broll-cta-m1">Kattints és</div>
            <div class="cm" id="broll-cta-m2">nézd meg</div>
            <div class="ce serif" id="broll-cta-e">a részleteket!</div>
            <div class="ul" id="broll-cta-ul"></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const ROOT = "#broll-cta ";
          const $ = (s) => document.querySelector(ROOT + s);
          const $$ = (s) => Array.from(document.querySelectorAll(ROOT + s));
          // Prime every drawable stroke so a 0 -> 1 "draw" is a dashoffset tween.
          $$("svg.wires .draw").forEach((p) => {
            const len = p.getTotalLength();
            p.style.strokeDasharray = len + " " + len;
            p.style.strokeDashoffset = len;
          });
          const draw = (sel, at, dur, ease) =>
            tl.to(ROOT + sel, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(ROOT + ".sc", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 0);
          tl.fromTo(ROOT + ".sc", { scale: 1 }, { scale: 1.03, duration: 3.0, ease: "none" }, 0);
          tl.fromTo("#broll-cta-m1", { opacity: 0, scale: 0.97, y: 8 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.12);
          tl.fromTo("#broll-cta-m2", { opacity: 0, scale: 0.97, y: 8 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "power2.out" }, 0.3);
          tl.fromTo("#broll-cta-e", { opacity: 0, scale: 1.06, y: 10, filter: "blur(6px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.55);
          tl.fromTo("#broll-cta-ico", { opacity: 0, scale: 0.82, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.55, ease: "power3.out" }, 0.85);
          tl.fromTo("#broll-cta-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.0);
          // A soft "click" pulse on the pointer once everything has landed.
          tl.to("#broll-cta-ico", { scale: 0.9, duration: 0.12, ease: "power1.in", yoyo: true, repeat: 1 }, 1.7);
          tl.to("#broll-cta .sc", { opacity: 0, duration: 0.5, ease: "power1.in" }, 2.5);
          window.__timelines["broll-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
