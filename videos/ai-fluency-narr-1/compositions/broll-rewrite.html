<!doctype html>
<html lang="hu">
  <head>

  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter Tight";
          src: url("assets/fonts/InterTight-800.ttf") format("truetype");
          font-weight: 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter Tight";
          src: url("assets/fonts/InterTight-700.ttf") format("truetype");
          font-weight: 700;
          font-style: normal;
        }
        @font-face {
          font-family: "Bodoni Moda";
          src: url("assets/fonts/BodoniModa-Italic-400.ttf") format("truetype");
          font-weight: 400;
          font-style: italic;
        }
        #broll-rewrite {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #fffdf8;
          font-family: "Inter Tight", sans-serif;
        }
        #broll-rewrite .sc {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1160px;
          transform-origin: 50% 45%;
        }
        #broll-rewrite .lbl {
          position: absolute;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          opacity: 0.6;
          white-space: nowrap;
        }
        #broll-rewrite .serif {
          font-family: "Bodoni Moda", serif;
          font-style: italic;
          font-weight: 400;
        }
        #broll-rewrite .box {
          position: absolute;
          border: 2px solid rgba(255, 253, 248, 0.85);
          border-radius: 22px;
        }
        #broll-rewrite .bar {
          position: absolute;
          height: 12px;
          border-radius: 6px;
          background: rgba(255, 253, 248, 0.34);
          transform-origin: 0% 50%;
        }
        #broll-rewrite .ic svg {
          display: block;
          width: 100%;
          height: 100%;
        }
        #broll-rewrite svg.wires {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1160px;
          overflow: visible;
        }
        #broll-rewrite svg.wires path,
        #broll-rewrite svg.wires line {
          fill: none;
          stroke: #fffdf8;
          stroke-width: 2;
          stroke-linecap: round;
        }

        #broll-rewrite .card {
          left: 110px;
          width: 860px;
          height: 300px;
        }
        #broll-rewrite .aa {
          position: absolute;
          left: 44px;
          top: 58px;
          font-size: 150px;
          line-height: 1;
        }
        #broll-rewrite .pen {
          position: absolute;
          width: 72px;
          height: 72px;
          left: 0;
          top: 0;
          opacity: 0;
        }
        #broll-rewrite .tag {
          position: absolute;
          left: 600px;
          top: 1000px;
          height: 72px;
          padding: 0 30px;
          border: 2px solid rgba(255, 253, 248, 0.9);
          border-radius: 36px;
          display: flex;
          align-items: center;
          gap: 14px;
          font-weight: 800;
          font-size: 36px;
          letter-spacing: -0.02em;
        }
        #broll-rewrite .tag .ic {
          width: 40px;
          height: 40px;
        }
      </style>

      <div id="broll-rewrite" data-composition-id="broll-rewrite" data-width="1080" data-height="1920">
        <div class="sc">
          <div class="lbl" id="broll-rewrite-l1" style="left: 114px; top: 216px">Eredeti</div>
          <div class="box card" id="broll-rewrite-c1" style="top: 270px">
            <div class="aa serif" id="broll-rewrite-aa1">Aa</div>
            <div class="bar b1" style="left: 250px; top: 70px; width: 540px"></div>
            <div class="bar b1" style="left: 250px; top: 114px; width: 590px"></div>
            <div class="bar b1" style="left: 250px; top: 158px; width: 480px"></div>
            <div class="bar b1" style="left: 250px; top: 202px; width: 570px"></div>
            <div class="bar b1" style="left: 250px; top: 246px; width: 330px"></div>
          </div>
          <div class="lbl" id="broll-rewrite-l2" style="left: 114px; top: 626px">Átdolgozott</div>
          <div class="box card" id="broll-rewrite-c2" style="top: 680px">
            <div class="aa serif" id="broll-rewrite-aa2">Aa</div>
            <div class="bar b2" style="left: 250px; top: 70px; width: 560px"></div>
            <div class="bar b2" style="left: 250px; top: 114px; width: 430px"></div>
            <div class="bar b2" style="left: 250px; top: 158px; width: 590px"></div>
            <div class="bar b2" style="left: 250px; top: 202px; width: 520px"></div>
            <div class="bar b2" style="left: 250px; top: 246px; width: 380px"></div>
          </div>
          <svg class="wires" viewBox="0 0 1080 1160">
            <path class="draw link" d="M150,480 C20,560 20,620 150,700" stroke-dasharray="6 10" />
          </svg>
          <div class="pen ic" id="broll-rewrite-pen"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" > <path d="M12 20h9" /> <path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z" /> </svg></div>
          <div class="tag" id="broll-rewrite-tag"><div class="ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" > <path d="M20 6 9 17l-5-5" /> </svg></div>stílus</div>
        </div>
      </div>

      <script>
        (function () {
          const ROOT = "#broll-rewrite ";
          const $ = (s) => document.querySelector(ROOT + s);
          const $$ = (s) => Array.from(document.querySelectorAll(ROOT + s));
          // Prime every drawable stroke so a 0 -> 1 "draw" is a dashoffset tween.
          $$("svg.wires .draw").forEach((p) => {
            const len = p.getTotalLength();
            p.style.strokeDasharray = len + " " + len;
            p.style.strokeDashoffset = len;
          });
          const draw = (sel, at, dur, ease) =>
            tl.to(ROOT + sel, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(ROOT + ".sc", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" }, 0);
          tl.fromTo(ROOT + ".sc", { scale: 1 }, { scale: 1.03, duration: 4.96, ease: "none" }, 0);
          const T = {"dolgoz": 0.62, "szoveg": 1.52, "megmarad": 3.02, "eredeti": 3.8, "stilus": 4.22, "end": 4.96};
          tl.fromTo("#broll-rewrite-c1, #broll-rewrite-l1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo(ROOT + ".b1", { scaleX: 0 }, { scaleX: 1, duration: 0.4, stagger: 0.06 }, 0.2);
          // The pen runs over the original lines ("dolgoztassunk át").
          tl.set("#broll-rewrite-pen", { x: 350, y: 300, opacity: 0 }, 0);
          tl.to("#broll-rewrite-pen", { opacity: 1, duration: 0.2 }, T.dolgoz);
          tl.to("#broll-rewrite-pen", { keyframes: [{ x: 900, y: 300 }, { x: 380, y: 384 }, { x: 900, y: 384 }, { x: 380, y: 468 }, { x: 760, y: 468 }], duration: 1.3, ease: "none" }, T.dolgoz);
          tl.to("#broll-rewrite-pen", { opacity: 0, duration: 0.2 }, T.dolgoz + 1.3);
          tl.fromTo("#broll-rewrite-c2, #broll-rewrite-l2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, T.szoveg);
          tl.fromTo(ROOT + ".b2", { scaleX: 0 }, { scaleX: 1, duration: 0.4, stagger: 0.07 }, T.szoveg + 0.2);
          tl.set("#broll-rewrite-aa2", { opacity: 0 }, 0);
          // "megmaradjon": the style mark travels from the original into the rewrite.
          draw("svg.wires .link", T.megmarad - 0.1, 0.5);
          tl.fromTo("#broll-rewrite-aa2", { opacity: 0, y: -60, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, T.megmarad + 0.1);
          tl.to("#broll-rewrite-aa1", { opacity: 0.55, duration: 0.4 }, T.megmarad + 0.1);
          tl.fromTo("#broll-rewrite-tag", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, T.stilus - 0.05);
          tl.to("#broll-rewrite .sc", { opacity: 0, y: -14, duration: 0.24, ease: "power1.in" }, 4.72);
          window.__timelines["broll-rewrite"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
