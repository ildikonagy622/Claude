<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("assets/fonts/InterTight-800.ttf") format("truetype");
        font-weight: 800;
        font-style: normal;
      }
      @font-face {
        font-family: "Bodoni Moda";
        src: url("assets/fonts/BodoniModa-Italic-400.ttf") format("truetype");
        font-weight: 400;
        font-style: italic;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0a10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0a10;
      }
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 32%;
      }
      #aroll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* Soft low-frame shade so the off-white type holds on the light shirt. Not a caption box. */
      #shade {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(10, 8, 16, 0) 38%,
          rgba(10, 8, 16, 0.22) 58%,
          rgba(10, 8, 16, 0.3) 72%,
          rgba(10, 8, 16, 0.12) 100%
        );
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="74.64"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam">
        <video
          id="aroll"
          class="clip"
          src="assets/video/cut.mp4"
          data-has-audio="true"
          data-start="0"
          data-duration="74.64"
          data-track-index="0"
          data-volume="1"
          playsinline
        ></video>
      </div>
      <div id="shade"></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-track-kind="captions"
        data-start="0"
        data-duration="74.64"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const CUTS = [0.0, 2.46, 4.02, 6.58, 8.68, 17.38, 23.64, 26.14, 29.2, 32.46, 35.22, 38.52, 42.12, 51.58, 57.74, 58.9, 64.56, 70.16];
      const DURATION = 74.64;
      const tl = gsap.timeline({ paused: true });

      // Camera: a slow push-in inside every cut, reset at the cut. The source edit already
      // alternates wide / close framing, so each cut lands as a punch.
      CUTS.forEach((t, i) => {
        const end = i + 1 < CUTS.length ? CUTS[i + 1] : DURATION;
        tl.fromTo(
          "#cam",
          { scale: 1 },
          { scale: 1.035, duration: end - t, ease: "none", immediateRender: i === 0 },
          t
        );
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
