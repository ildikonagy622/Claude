<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Inter Tight";
          src: url("assets/fonts/InterTight-800.ttf") format("truetype");
          font-weight: 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter Tight";
          src: url("assets/fonts/InterTight-700.ttf") format("truetype");
          font-weight: 700;
          font-style: normal;
        }
        @font-face {
          font-family: "Bodoni Moda";
          src: url("assets/fonts/BodoniModa-Italic-400.ttf") format("truetype");
          font-weight: 400;
          font-style: italic;
        }
        #broll-tools {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #fffdf8;
          font-family: "Inter Tight", sans-serif;
        }
        #broll-tools .bt-bg {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(ellipse 80% 55% at 50% 34%, #2a1d52 0%, #150f2a 55%, #0b0a10 100%);
        }
        #broll-tools .bt-grid {
          position: absolute;
          inset: 0;
          background-image:
            linear-gradient(rgba(255, 253, 248, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 253, 248, 0.05) 1px, transparent 1px);
          background-size: 90px 90px;
          background-position: 45px 30px;
        }
        #broll-tools .bt-stack {
          position: absolute;
          left: 210px;
          right: 90px;
          top: 240px;
          height: 840px;
        }
        #broll-tools .bt-rail {
          position: absolute;
          left: 38px;
          top: 125px;
          width: 2px;
          height: 640px;
          background: rgba(255, 253, 248, 0.35);
          transform-origin: 50% 0%;
        }
        #broll-tools .bt-row {
          position: absolute;
          left: 0;
          right: 0;
          height: 200px;
          display: flex;
          align-items: center;
        }
        #broll-tools .bt-dot {
          position: absolute;
          left: 26px;
          top: 112px;
          width: 26px;
          height: 26px;
          border-radius: 50%;
          border: 2px solid #fffdf8;
          background: #150f2a;
        }
        #broll-tools .bt-when {
          position: absolute;
          left: 90px;
          top: 26px;
          font-weight: 700;
          font-size: 30px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          opacity: 0.6;
        }
        #broll-tools .bt-chip {
          position: absolute;
          left: 90px;
          top: 72px;
          height: 132px;
          padding: 0 54px;
          display: flex;
          align-items: center;
          gap: 22px;
          border: 2px solid rgba(255, 253, 248, 0.9);
          border-radius: 66px;
          font-weight: 800;
          font-size: 84px;
          letter-spacing: -0.04em;
          white-space: nowrap;
        }
        #broll-tools .bt-chip svg {
          width: 66px;
          height: 66px;
          flex: none;
        }
        #broll-tools .bt-chip.bt-unknown {
          border-style: dashed;
          font-family: "Bodoni Moda", serif;
          font-style: italic;
          font-weight: 400;
          font-size: 100px;
          letter-spacing: -0.01em;
        }
        #broll-tools .bt-q {
          display: inline-block;
          min-width: 380px;
        }
      </style>

      <div id="broll-tools" data-composition-id="broll-tools" data-width="1080" data-height="1920">
        <div class="bt-bg"></div>
        <div class="bt-grid"></div>
        <div class="bt-stack">
          <div class="bt-rail" id="bt-rail"></div>

          <div class="bt-row" id="bt-r1" style="top: 0px">
            <div class="bt-dot"></div>
            <div class="bt-when">Ma</div>
            <div class="bt-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" /></svg>
              <span>ChatGPT</span>
            </div>
          </div>

          <div class="bt-row" id="bt-r2" style="top: 290px">
            <div class="bt-dot"></div>
            <div class="bt-when">Holnap</div>
            <div class="bt-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" /></svg>
              <span>Claude</span>
            </div>
          </div>

          <div class="bt-row" id="bt-r3" style="top: 580px">
            <div class="bt-dot"></div>
            <div class="bt-when">Aztán</div>
            <div class="bt-chip bt-unknown"><span class="bt-q" id="bt-q">?</span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          // Local times (s) — this clip starts at 23.70 on the root timeline.
          // ChatGPT 24.01, Claude 25.65, "aztán valami" 26.27, "a nevét is" 28.45.
          const T = { chat: 0.31, claude: 1.95, then: 2.57, name: 4.75, end: 5.55 };
          const tl = gsap.timeline({ paused: true });

          tl.fromTo("#broll-tools .bt-bg, #broll-tools .bt-grid", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0);
          tl.fromTo("#bt-rail", { scaleY: 0 }, { scaleY: 1, duration: T.then + 0.4, ease: "power1.inOut" }, 0.1);

          [["#bt-r1", T.chat], ["#bt-r2", T.claude], ["#bt-r3", T.then]].forEach(([row, at]) => {
            tl.fromTo(row + " .bt-dot", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, at - 0.05);
            tl.fromTo(row + " .bt-when", { opacity: 0, x: -14 }, { opacity: 0.6, x: 0, duration: 0.35, ease: "power2.out" }, at - 0.05);
            tl.fromTo(row + " .bt-chip", { opacity: 0, x: 40, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "power3.out" }, at);
          });
          // Earlier tools step back when the next one arrives.
          tl.to("#bt-r1 .bt-chip", { opacity: 0.35, duration: 0.4 }, T.claude);
          tl.to("#bt-r2 .bt-chip", { opacity: 0.35, duration: 0.4 }, T.then + 0.2);

          // The unnamed tool: letters shuffle (seeded, deterministic) and settle on "?".
          const GLYPHS = "AÉIKLMNOSTVXZ?";
          let seed = 7;
          const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
          const frames = [];
          for (let i = 0; i < 18; i++) {
            let s = "";
            for (let k = 0; k < 6; k++) s += GLYPHS[Math.floor(rnd() * GLYPHS.length)];
            frames.push(s.toLowerCase());
          }
          // Driven from timeline time (not tl.call) so any seek lands on the right text.
          const q = document.getElementById("bt-q");
          const step = (T.name - T.then - 0.3) / frames.length;
          tl.to({}, {
            duration: T.end,
            ease: "none",
            onUpdate() {
              const t = this.time();
              const i = Math.floor((t - T.then - 0.3) / step);
              q.textContent = t >= T.name || i < 0 ? "?" : frames[Math.min(i, frames.length - 1)];
            },
          }, 0);
          tl.fromTo("#bt-q", { scale: 1.25, opacity: 0.4 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, T.name);

          tl.to("#broll-tools", { opacity: 0, duration: 0.22, ease: "power1.in" }, T.end - 0.22);
          window.__timelines["broll-tools"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
