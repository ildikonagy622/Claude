          const SPAN = 3.231;

          const A = [0.282, 0.769, 1.257, 1.768];

          const cards = ["#f4_card1", "#f4_card2", "#f4_card3"];
          const checks = ["#f4_check1", "#f4_check2", "#f4_check3"];

          // Initial states before building the timeline (stable baselines).
          gsap.set(cards, { opacity: 0, y: 40 });
          gsap.set(checks, { opacity: 0, scale: 0.6 });
          gsap.set("#f4_head", { opacity: 0, y: 34 });
          gsap.set("#f4_pill", { opacity: 0, scale: 0.9 });
          gsap.set("#f4_glow", { opacity: 0.75, scale: 0.92 });

          const tl = gsap.timeline({ paused: true });

          // Glow: brief dip, then swells into the 1.257 surge, settles.
          tl.fromTo("#f4_glow", { opacity: 0.75, scale: 0.92 },
            { opacity: 1, scale: 1.08, duration: 1.2, ease: "sine.inOut" }, 0.06);
          tl.to("#f4_glow", { opacity: 0.9, scale: 1.0, duration: 1.4, ease: "sine.inOut" }, 1.26);

          // Cards: one per anchor, short rise + fade (reactive, fires on the hit).

              { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" }, A[i]);
            // Lime check pops ~0.15s after its card; no overshoot.
            tl.fromTo(checks[i], { opacity: 0, scale: 0.6 },
              { opacity: 1, scale: 1, duration: 0.22, ease: "power2.out" }, A[i] + 0.15);
          });

          // Surge (1.257): headline lands below the cards.
          tl.fromTo("#f4_head", { opacity: 0, y: 34 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, A[2]);

          // 1.768: lime pill snaps in (scale 0.9→1 + fade, no overshoot).

            { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, A[3]);

          // Everything holds still from ~2.66s to SPAN.

          tl.seek(0);
          window.__timelines["04-f4"] = tl;
