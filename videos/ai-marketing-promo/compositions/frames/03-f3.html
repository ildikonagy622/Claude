          gsap.set(".f3_badge", { opacity: 0, scale: 0.6 });
          gsap.set("#f3_link", { scaleX: 0, transformOrigin: "0% 50%" });
          gsap.set("#f3_pchip", { x: 0, opacity: 0, scale: 0.8 });
          gsap.set("#f3_dcard", { x: 0, opacity: 0, scale: 0.8 });

          gsap.set("#f3_pill", { opacity: 0, scale: 0.9, y: 8 });

          var tl = gsap.timeline({ paused: true });

          // ---- slot 1: digital B-roll (0 -> 2.275) ----
          // 0 -> B1: tiles fly in from opposite sides, scale 0.85 -> 1, land on B1

          tl.to("#f3_tileB", { x: 0, scale: 1, duration: B1, ease: "power3.out" }, 0);
          tl.to(["#f3_tileA", "#f3_tileB"], { opacity: 1, duration: B1 * 0.8, ease: "power1.out" }, 0);

          // B1 -> B2: connector draws from the ChatGPT tile; violet border pulse on B2
          tl.to("#f3_link", { scaleX: 1, duration: 0.36, ease: "power2.inOut" }, B1 + 0.04);
          tl.to(".f3_halo", { opacity: 1, duration: 0.1, ease: "power2.out" }, B2);
          tl.to(".f3_halo", { opacity: 0.3, duration: 0.5, ease: "sine.inOut" }, B2 + 0.1);

          // B2 -> B3: prompt chip travels ChatGPT -> Canva
          tl.to("#f3_pchip", { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, B2);
          tl.to("#f3_pchip", { x: LINK_W, duration: B3 - B2 - 0.03, ease: "power2.inOut" }, B2);
          tl.to("#f3_pchip", { opacity: 0, scale: 0.85, duration: 0.09, ease: "power2.in" }, B3 - 0.12);

          // B3 -> B4: design card returns Canva -> ChatGPT
          tl.to("#f3_dcard", { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, B3);
          tl.to("#f3_dcard", { x: -LINK_W, duration: B4 - B3 - 0.03, ease: "power2.inOut" }, B3);
          tl.to("#f3_dcard", { opacity: 0, scale: 0.85, duration: 0.09, ease: "power2.in" }, B4 - 0.12);

          // glowing dots streaming along the line (2 outbound, 2 return; staggered by index)
          for (var k = 0; k < 4; k++) {
            var dsel = "#f3_dot" + k;

            tl.to(dsel, { x: dotDir[k] > 0 ? LINK_W : 0, duration: travel, ease: "none" }, st);
            tl.to(dsel, { opacity: 0, duration: 0.06, ease: "none" }, st + travel - 0.06);

          // background glow: slow breathe, swell on the B3 downbeat
          tl.to("#f3_bglow", { opacity: 0.88, scale: 1.0, duration: B3, ease: "sine.inOut" }, 0);
          tl.to("#f3_bglow", { opacity: 1, scale: 1.08, duration: 0.16, ease: "power2.out" }, B3);
          tl.to("#f3_bglow", { opacity: 0.9, scale: 1.05, duration: 0.6, ease: "sine.inOut" }, B3 + 0.16);

          // B4: connected — pill snaps in, check badges land on both tiles
          tl.to("#f3_pill", { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "power2.out" }, B4);
          tl.to(".f3_badge", { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" }, B4);
          tl.to(".f3_halo", { opacity: 0.55, duration: 0.2, ease: "power2.out" }, B4);

          // hold with a very slow push to the cut

          // gentle push on each full-bleed clip (scale 1.0 -> 1.04 over its window)
          tl.to("#f3_v2", { scale: 1.04, duration: ends[1] - cuts[1], ease: "none" }, cuts[1]);
          tl.to("#f3_v4", { scale: 1.04, duration: ends[3] - cuts[3], ease: "none" }, cuts[3]);

          tl.to("#f3_glow", { opacity: 1, scale: 1.04, duration: ends[2] - cuts[2], ease: "sine.inOut" }, cuts[2]);

          for (var i = 0; i < 4; i++) {
            var s = "#f3_s" + (i + 1);

            if (i > 0) {
