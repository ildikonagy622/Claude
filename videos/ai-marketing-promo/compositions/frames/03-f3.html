        <!-- slot 4: Canva deck, full-bleed -->

      <script>
        (function () {
          var DUR = 4.919;
          var cuts = [0, 1.253, 2.252, 3.715];
          var ends = [1.253, 2.252, 3.715, DUR];

          // initial states (stable baselines) — set before the timeline is built
          gsap.set("#f3_lt", { opacity: 0, y: 24 });
          gsap.set(".f3_step", { opacity: 0, y: 18 });
          gsap.set(".f3_fill", { scaleX: 0 });
          gsap.set("#f3_tileA", { x: -150, opacity: 0 });
          gsap.set("#f3_tileB", { x: 150, opacity: 0 });
          gsap.set("#f3_link", { scaleX: 0 });
          gsap.set("#f3_pill", { opacity: 0, scale: 0.86, y: 10 });
          gsap.set("#f3_bglow", { opacity: 0.75, scale: 0.94 });
          gsap.set(["#f3_v2", "#f3_v4"], { scale: 1.0 });
          gsap.set("#f3_v3", { scale: 0.97, y: 16 });
          gsap.set("#f3_glow", { opacity: 0.7, scale: 0.94 });

          var tl = gsap.timeline({ paused: true });

          // lower-third card enters once, persists across cuts
          tl.to("#f3_lt", { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);

          // slot 1: digital B-roll — tiles converge, connector draws, chip snaps in (done by ~1.0s)
          tl.to("#f3_tileA", { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.0);
          tl.to("#f3_tileB", { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.0);
          tl.to("#f3_link", { scaleX: 1, duration: 0.28, ease: "power2.out" }, 0.42);
          tl.to("#f3_pill", { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "power3.out" }, 0.72);
          tl.to("#f3_bglow", { opacity: 1, scale: 1.04, duration: ends[0], ease: "sine.inOut" }, 0);

          // gentle push on each full-bleed clip (scale 1.0 -> 1.04 over its window)
          tl.to("#f3_v2", { scale: 1.04, duration: ends[1] - cuts[1], ease: "none" }, cuts[1]);
          tl.to("#f3_v4", { scale: 1.04, duration: ends[3] - cuts[3], ease: "none" }, cuts[3]);

          // slot 3: floating card settles in, then drifts
          tl.to("#f3_v3", { scale: 1.0, y: 0, duration: 0.35, ease: "power3.out" }, cuts[2]);
          tl.to("#f3_v3", { scale: 1.02, duration: ends[2] - cuts[2] - 0.35, ease: "none" }, cuts[2] + 0.35);
          tl.to("#f3_glow", { opacity: 1, scale: 1.04, duration: ends[2] - cuts[2], ease: "sine.inOut" }, cuts[2]);

          // step text swap + rail fill on each cut
          for (var i = 0; i < 4; i++) {
            var s = "#f3_s" + (i + 1);
            var t = cuts[i];
            if (i > 0) {
              tl.to("#f3_s" + i, { opacity: 0, y: -10, duration: 0.12, ease: "power2.in" }, t - 0.12);
            }
            tl.to(s, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, t);
            tl.to("#f3_f" + (i + 1), { scaleX: 1, duration: 0.3, ease: "power2.out" }, t);
          }

          window.__timelines["03-f3"] = tl;
          tl.seek(0);
        })();
